# Data Sources Configuration
kaggle_datasets:
  - owner: "gaborvisky"
    dataset: "ais-dataset"
    purpose: "ais_supporting_data"
    category: "ais"
    scope: "GLOBAL_SUPPORTING"
    description: "AIS trajectory & vessel behavior dataset for supporting feature algorithms"

local_datasets:
  - path: "cargo traffic data"
    category: "government/traffic"
    scope: "INDIA_REAL"
    description: "IPA and Indian Major Port traffic reports (Paradip, Visakhapatnam, Haldia, Chennai, etc.)"
  - path: "WORLD BANK COMMODITY DATA"
    category: "market"
    scope: "GLOBAL_SUPPORTING"
    description: "World Bank Commodity Price Data (Pink Sheet) for coal, crude, and metals"
  - path: "Commodity Coal Prices"
    category: "market"
    scope: "GLOBAL_SUPPORTING"
    description: "Historical benchmark coal price time series"
  - path: "Global Daily Port Activity and Trade Estimates"
    category: "ports"
    scope: "GLOBAL_SUPPORTING"
    description: "UN / IMF global port daily activity and call estimates"

port_constraints:
  PARADIP:
    max_draft_m: 16.0
    max_loa_m: 290.0
    max_beam_m: 45.0
    max_dwt_tonnes: 120000
    allowed_vessel_classes: ["Handysize", "Supramax", "Panamax", "Capesize"]
    avg_turnaround_days: 2.8
    anchorage_lat: 20.26
    anchorage_lon: 86.68
  VISAKHAPATNAM:
